YAML
name: Build QuickTorch APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: QuickTorch

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          validate-wrappers: false

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK for easy download
        run: cp app/build/outputs/apk/debug/app-debug.apk QuickTorch-v1.0.0.apk

      - name: Upload QuickTorch APK
        uses: actions/upload-artifact@v4
        with:
          name: QuickTorch-APK
          path: QuickTorch/QuickTorch-v1.0.0.apk
          retention-days: 30
